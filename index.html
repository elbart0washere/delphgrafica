<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gráfica Delph — Sitio en construcción</title>
  <meta name="description" content="Gráfica Delph: impresión en gran formato, impresión digital y offset, merchandising y packaging corporativo en Paso del Rey, Moreno. Cotizá tu proyecto por WhatsApp.">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_AR">
  <meta property="og:title" content="Gráfica Delph — Sitio en construcción">
  <meta property="og:description" content="Impresión en gran formato, digital y offset, merchandising y packaging corporativo. Cotizá tu proyecto por WhatsApp.">
  <meta property="og:url" content="https://delphgrafica.com.ar/">
  <meta property="og:image" content="https://delphgrafica.com.ar/assets/og.jpg">

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preload" href="assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/styles.css">
  <noscript><style>.js-only{display:none}</style></noscript>
  <script type="module" src="js/main.js"></script>
</head>
<body class="bg-paper font-sans text-ink antialiased">
  <header class="mx-auto flex max-w-6xl items-center px-4 py-4 sm:px-6">
    <a href="#inicio" aria-label="Gráfica Delph, ir al inicio">
      <img src="assets/logo.jpg" alt="Gráfica Delph" width="480" height="513" class="h-16 w-auto mix-blend-multiply">
    </a>
  </header>

  <main>
    <section id="inicio"></section>
    <section id="trabajos"></section>
    <section id="servicios"></section>
    <section id="cotizar" tabindex="-1" aria-labelledby="cotizar-titulo" class="focus:outline-none">
      <div class="mx-auto max-w-2xl px-4 py-16 sm:px-6 sm:py-24">
        <h2 id="cotizar-titulo" class="text-3xl font-bold tracking-tight sm:text-4xl">Contanos qué necesitás</h2>
        <p class="mt-3 text-lg text-neutral-700">Completá el formulario y seguimos la charla por WhatsApp.</p>

        <noscript>
          <p class="mt-8 rounded-lg border-2 border-ink p-4">Activá JavaScript o escribinos directo por <a class="font-semibold underline" href="https://wa.me/5491172394787">WhatsApp</a>.</p>
        </noscript>

        <form id="form-cotizar" class="js-only mt-8 space-y-5" novalidate>
          <div>
            <label for="nombre" class="block text-sm font-semibold">Nombre</label>
            <input id="nombre" name="nombre" type="text" maxlength="60" autocomplete="name" aria-describedby="nombre-error" class="mt-1 block min-h-11 w-full rounded-lg border border-neutral-500 bg-white px-4 py-2 text-base aria-invalid:border-2 aria-invalid:border-ink">
            <p id="nombre-error" role="alert" class="mt-1 border-l-4 border-ink pl-3 text-sm font-semibold empty:hidden"></p>
          </div>

          <p class="text-sm text-neutral-700">Completá al menos uno de los dos: email o teléfono.</p>

          <div>
            <label for="email" class="block text-sm font-semibold">Email</label>
            <input id="email" name="email" type="email" inputmode="email" maxlength="100" autocomplete="email" aria-describedby="email-error contacto-error" class="mt-1 block min-h-11 w-full rounded-lg border border-neutral-500 bg-white px-4 py-2 text-base aria-invalid:border-2 aria-invalid:border-ink">
            <p id="email-error" role="alert" class="mt-1 border-l-4 border-ink pl-3 text-sm font-semibold empty:hidden"></p>
          </div>

          <div>
            <label for="telefono" class="block text-sm font-semibold">Teléfono</label>
            <input id="telefono" name="telefono" type="tel" inputmode="tel" maxlength="30" autocomplete="tel" aria-describedby="telefono-error contacto-error" class="mt-1 block min-h-11 w-full rounded-lg border border-neutral-500 bg-white px-4 py-2 text-base aria-invalid:border-2 aria-invalid:border-ink">
            <p id="telefono-error" role="alert" class="mt-1 border-l-4 border-ink pl-3 text-sm font-semibold empty:hidden"></p>
            <p id="contacto-error" role="alert" class="mt-1 border-l-4 border-ink pl-3 text-sm font-semibold empty:hidden"></p>
          </div>

          <div>
            <label for="descripcion" class="block text-sm font-semibold">Descripción del proyecto</label>
            <textarea id="descripcion" name="descripcion" rows="5" maxlength="500" aria-describedby="descripcion-contador descripcion-aviso descripcion-error" class="mt-1 block min-h-11 w-full rounded-lg border border-neutral-500 bg-white px-4 py-2 text-base aria-invalid:border-2 aria-invalid:border-ink"></textarea>
            <p id="descripcion-contador" class="mt-1 text-right text-sm text-neutral-700">0 / 500</p>
            <p id="descripcion-aviso" role="status" class="mt-1 text-sm font-semibold empty:hidden"></p>
            <p id="descripcion-error" role="alert" class="mt-1 border-l-4 border-ink pl-3 text-sm font-semibold empty:hidden"></p>
          </div>

          <button id="btn-enviar" type="submit" class="inline-flex min-h-11 items-center justify-center rounded-full bg-accent px-8 py-3 text-base font-bold text-white hover:brightness-90">Enviar por WhatsApp</button>
          <p id="estado" role="status" class="text-sm empty:hidden"></p>
        </form>
      </div>
    </section>
  </main>

  <footer id="pie"></footer>
</body>
</html>
